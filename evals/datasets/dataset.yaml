# QueryForge 评估数据集
# 判定标准:执行准确率(execution accuracy)——评估时黄金 SQL 与 Agent 生成 SQL 在同一 dw 库执行后比对结果集
# category 取值: single_agg / time_filter / join / metric / share / rank / group_by / non_query
# non_query 用例无需 expected_sql,期望行为是入口分类为 false 并走「回答问题」

- id: E001
  query: 一共有多少笔订单
  category: single_agg
  expected_sql: SELECT COUNT(order_id) AS order_count FROM fact_order
  notes: 最基本计数

- id: E002
  query: 2025年1月份的销售额总和是多少
  category: single_agg
  expected_sql: SELECT SUM(order_amount) AS total_sales FROM fact_order WHERE date_id BETWEEN 20250101 AND 20250131
